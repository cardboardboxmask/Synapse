    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Synapse",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "All",
        "description": "Free, volunteer-run, non-profit community platform for makers, researchers, and problem-solvers to share ideas, connect specifications, and volunteer to build.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Synapse?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Synapse is a free, volunteer-run open protocol and community platform where makers, researchers, and students post real-world problem specifications, connect complementary specs, and volunteer to build prototypes."
            }
          },
          {
            "@type": "Question",
            "name": "Who owns the ideas posted on Synapse?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ideas belong 100% to their creators. Synapse operates on an open-access model with no platform fees, paywalls, or forced copyright assignments."
            }
          },
          {
            "@type": "Question",
            "name": "How can I volunteer to build a prototype?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Browse any idea on the Explore page, view its problem specification and help track requirements, and offer to volunteer or connect your own complementary idea."
            }
          },
          {
            "@type": "Question",
            "name": "Is Synapse open source?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes! The entire Synapse codebase and platform are open source under the MIT License, deployable on GitHub Pages with automated GitHub Actions."
            }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Single Page Apps for GitHub Pages path decoder -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
